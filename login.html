<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css" />
    <title>Iniciar Sesión</title>
</head>
<body>
    <div class="screen">

        <!--Div de la imagen de la parte de arriba-->
        <div class="hero">
            <svg viewBox="0 0 320 200" preserveAspectRatio="none">
                <path d="M0,50 C60,110 100,10 160,70 C220,130 260,30 320,90 L320,0 L0,0 Z" fill="#e2e4e8" />
                <path d="M0,120 C60,60 100,160 160,100 C220,40 260,140 320,100 L320,200 L0,200 Z" fill="#d8dade" opacity="0.6" />
                <path d="M0,150 C70,110 110,190 170,150 C230,110 270,190 320,160" fill="none" stroke="#c7cad0" stroke-width="2" />
                <path d="M0,180 C70,140 110,220 170,180 C230,140 270,220 320,190" fill="none" stroke="#c7cad0" stroke-width="2" />
            </svg>
        </div>

        <!--Div del apartado de inicio de sesión-->
        <div class="content">

            <!--Titulo y subtitulo-->
            <h1>Iniciar sesión</h1>
            <p class="subtitle">Ingresa tus datos para continuar como <span>Aprendiz Sena</span></p>

            <!--Formulario de ingreso de datos-->
            <form>
                <label for="Username">Ingresa tu usuario</label>
                <input type="text" id="Username" name="Username" placeholder="Usuario">

                <label for="Password">Ingresa tu contraseña</label>
                <input type="password" id="Password" name="Password" placeholder="********">
            </form>

            <div class="remember-row">
                <label class="remember">
                    <input type="checkbox" id="RememberMe" name="RememberMe" checked>
                    Recuérdame
                </label>
                <a href="#">Recuperar contraseña</a>
            </div>

            <!--Boton de inicio de sesion-->
            <button class="login-btn">Iniciar sesión</button>

            <!--Apartado de instructor, aprendiz y funcionario-->
            <div class="roles">
                <div class="role active">
                    <button>🎓</button>
                    <p>Aprendiz</p>
                </div>
                <div class="role">
                    <button>🧑‍🏫</button>
                    <p>Instructor</p>
                </div>
                <div class="role">
                    <button>👨‍💻</button>
                    <p>Funcionario</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
