<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<body bgcolor="white">
    <!--Div de la imagen de la parte de arriba-->
    <div></div>

    <!--Div del apartado de incio de sesion-->
    <div>

        <!--Titulo y subtitulo-->
        <h1>Iniciar Sesión</h1>
        <p>Ingresa tus datos para continuar como Aprendiz Sena</p>

        <!--Formulario de ingreso de datos-->
        <form>
            <label for="Username">Ingresa tu Usuario:</label>
            <input type="text" id="Username" name="Username" placeholder="Usuario"><br>
            <label for="Password">Ingresa tu Contraseña:</label>
            <input type="password" id="Password" name="Password" placeholder="********"><br>
        </form>
        <div>
            <input type="checkbox" id="RememberMe" name="RememberMe">Recuérdame<br>
            <a href="">Recuperar Contraseña</a>
        </div>
        <!--Boton de inicio de sesion-->
        <button>Iniciar Sesión</button>

        <!--Apartado de instructor, aprendiz y funcionario-->
        <div>
            <div>
            <button>🎓</button>
            <p>Aprendiz</p>
            </div>
            <div>
            <button>🧑‍🏫</button>
            <p>Instructor</p>
            </div>
            <div>
            <button>👨‍💻</button>
            <p>Funcionario</p>
            </div>
        </div>
    </div>
</body>
</html>
